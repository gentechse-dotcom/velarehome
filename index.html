<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:title" content="Velarehome · Project Management & Home Care">
<meta property="og:description" content="Velamos por tu casa como si fuera la nuestra. Máximo 10 villas por gestor.">
<meta property="og:image" content="https://velarehome.com/sienna-atardecer.jpg">
<meta property="og:url" content="https://velarehome.com/">
<link rel="canonical" href="https://velarehome.com/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 20 16 8l9 8' fill='none' stroke='%238C7556' stroke-width='2.5' stroke-linecap='round'/%3E%3Cpath d='M24 22c-2-4-2-9 0-13 2 4 2 9 0 13z' fill='%238C7556'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Velarehome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap">
<style>
/* Layout: editorial, aireado. Columna de 1120px, cabecera mínima, bloques alternos arena/lino, área privada con sidebar fina. */
:root{
  --bg:#FAF8F4;          /* blanco roto */
  --surface:#F2EDE4;     /* arena suave */
  --fg:#2A2420;          /* tierra oscura */
  --clay:#A0674B;        /* arcilla */
  --muted:#6E6B5B;       /* olivo gris (AA sobre arena) */
  --line:#E5DED2;
  --accent:#D4FF3A;      /* lima flúor: solo CTA, cifra 10, pendiente */
  --on-accent:#2A2420;
  --alert:#FF5A1F;       /* naranja neón: solo alertas privadas */
  --alert-bg:#FFE6DB;
  --card:#FFFFFF;
  /* ilustraciones */
  --sky:#E6DCCB; --hill:#CFC3A9; --hill2:#BDB094; --ground:#DDD2BE;
  --wall:#FBF8F2; --wall-shade:#E7DECF; --glass:#3B332D; --pool:#9DB8B2; --tree:#7D7A68; --sun:#E3B9A0;
  --serif:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sans:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:3px;
  --wrap:100%;
  --gutter:clamp(16px,5vw,112px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1E1A17; --surface:#28221E; --fg:#EFE8DC; --clay:#D29A7C; --muted:#ADA793; --line:#3E3630; --card:#25201C;
  --alert-bg:#3A1F14;
  --sky:#2C2622; --hill:#3A332C; --hill2:#443C33; --ground:#332C26; --wall:#D9CFBF; --wall-shade:#BDB2A1; --glass:#2A2420; --pool:#5E7C77; --tree:#6F6C5C; --sun:#8A5A44;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E1A17; --surface:#28221E; --fg:#EFE8DC; --clay:#D29A7C; --muted:#ADA793; --line:#3E3630; --card:#25201C;
  --alert-bg:#3A1F14;
  --sky:#2C2622; --hill:#3A332C; --hill2:#443C33; --ground:#332C26; --wall:#D9CFBF; --wall-shade:#BDB2A1; --glass:#2A2420; --pool:#5E7C77; --tree:#6F6C5C; --sun:#8A5A44;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.65;font-weight:400;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit}
h1,h2,h3{font-family:var(--sans);font-weight:400;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:clamp(2rem,3.6vw,3.1rem)}
h2{font-size:clamp(1.6rem,2.6vw,2.3rem)}
h3{font-size:1.15rem;font-weight:500;letter-spacing:-.01em}
em{font-style:normal;color:var(--clay)}
p{margin:0}
:focus-visible{outline:2px solid var(--clay);outline-offset:3px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.eyebrow{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
.lead{font-size:1.02rem;color:var(--muted);max-width:56ch}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:.5rem;font:500 .92rem/1 var(--sans);padding:.95rem 1.4rem;border-radius:var(--radius);border:1px solid var(--fg);background:transparent;color:var(--fg);text-decoration:none;cursor:pointer;transition:background .2s,color .2s}
.btn:hover{background:var(--fg);color:var(--bg)}
.btn-primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn-primary:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn-dark{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn-dark:hover{background:transparent;color:var(--fg)}
.btn-sm{padding:.6rem .95rem;font-size:.84rem}
.link{color:var(--clay);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px;font-weight:500;font-size:.95rem}
.link:hover{color:var(--fg)}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Cabecera pública ---------- */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.site-header .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;height:72px}
.logo{font-family:"Cormorant Garamond",Garamond,"Times New Roman",serif;font-weight:500;font-size:1.65rem;line-height:1;text-decoration:none;letter-spacing:0;white-space:nowrap}
.logo small{display:block;font-family:var(--sans);font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.nav{display:flex;align-items:center;gap:1.8rem}
.nav a{text-decoration:none;font-size:.9rem}
.nav a.on{border-bottom:1px solid var(--fg)}
.nav .access{background:var(--accent);color:var(--on-accent);display:inline-flex;gap:.4rem;align-items:center;padding:.45rem .8rem;border-radius:var(--radius);font-weight:500}
.nav .access:hover{background:var(--fg);color:var(--accent)}
.burger{display:none;background:none;border:0;color:var(--fg);padding:.5rem;cursor:pointer}
@media (max-width:920px){
  .nav{position:fixed;inset:72px 0 auto 0;top:calc(72px + env(safe-area-inset-top,0px));flex-direction:column;align-items:flex-start;gap:1.2rem;background:var(--bg);border-bottom:1px solid var(--line);padding:1.5rem max(16px,env(safe-area-inset-right,0px)) 2rem max(16px,env(safe-area-inset-left,0px));display:none}
  .nav.open{display:flex}
  .nav a{font-size:1.1rem}
  .burger{display:block}
}

/* ---------- Secciones ---------- */
section.band{padding-block:clamp(4rem,9vw,7.5rem)}
section.alt{background:var(--surface)}
.sec-head{display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:end;margin-bottom:3.5rem}
.sec-head > *{min-width:0}
@media (max-width:760px){.sec-head{grid-template-columns:1fr}}

.hero{padding-block:clamp(2rem,4vw,3.5rem) 0}
.hero-grid{display:grid;grid-template-columns:5fr 7fr;gap:clamp(2rem,4vw,4rem);align-items:center}
.hero-grid > *{min-width:0}
.hero-text{display:flex;flex-direction:column;gap:1.4rem}
.hero h1{max-width:16ch;font-size:clamp(2rem,3.2vw,3.6rem)}
.hero-ctas{display:flex;gap:1.4rem;align-items:center;flex-wrap:wrap;margin-top:.4rem}
.hero-img{position:relative}
.hero-img .ph{aspect-ratio:auto !important;height:clamp(340px,68vh,820px)}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}.hero-img .ph{height:auto;aspect-ratio:4/3 !important}}
.illus{display:block;width:100%;height:auto;max-width:100%;border-radius:var(--radius)}
.ph{max-width:100%;overflow:hidden;border-radius:var(--radius);background:var(--surface)}
img.photo{display:block;width:100%;height:100%;max-width:100%;object-fit:cover}
.works{display:grid;grid-template-columns:5fr 4fr 4fr;grid-template-rows:auto auto;gap:1.2rem}
.works figure{margin:0;display:flex;flex-direction:column;gap:.6rem;min-width:0}
.works figure .ph{flex:1}
.works figcaption{font-size:.85rem;color:var(--muted)}
.works figcaption b{display:block;color:var(--fg);font-weight:500}
.works .tall{grid-row:span 2}
.works .wide{grid-column:span 2}
@media (max-width:820px){.works{grid-template-columns:1fr 1fr}.works .tall{grid-row:auto;grid-column:span 2}.works .wide{grid-column:span 2}}
@media (max-width:520px){.works{grid-template-columns:1fr}.works .tall,.works .wide{grid-column:auto}}
.case{display:grid;grid-template-columns:7fr 4fr;gap:1.2rem}
.case > *{min-width:0}
.case figure{margin:0}
.case-main .ph{height:100%}
.case-side{display:grid;gap:1.2rem}
.case-meta{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--fg);margin-top:1.6rem}
.case-meta > div{padding:1.2rem 1.5rem 0 0;display:flex;flex-direction:column;gap:.3rem;min-width:0}
.case-meta > div + div{padding-left:1.5rem;border-left:1px solid var(--line)}
.case-meta span{color:var(--muted);font-size:.9rem}
.case-meta b{font-weight:500}
@media (max-width:820px){.case{grid-template-columns:1fr}.case-side{grid-template-columns:1fr 1fr}.case-meta{grid-template-columns:1fr}.case-meta > div + div{padding-left:0;border-left:0}}
.page-img{margin-top:2.5rem}
.detail,#svc-planes{scroll-margin-top:90px}
.landing{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;color:#2E2620;background:#EBD9C4 url('velare-fondo.jpg') center 30%/cover no-repeat;padding-block:clamp(3rem,9vh,6rem) 3rem;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.landing::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 48% 42% at 50% 36%,rgba(250,240,228,.6),rgba(250,240,228,0) 100%),linear-gradient(180deg,rgba(250,240,228,.3) 0%,rgba(250,240,228,0) 70%);pointer-events:none}
.landing > *{position:relative}
.vh-logo{width:min(560px,86vw);height:auto;display:block}
.vh-word{font-family:"Cormorant Garamond",Garamond,"Times New Roman",serif;font-weight:500;font-size:clamp(3.4rem,9vw,6.2rem);line-height:.95;letter-spacing:-.01em;margin:-.15em 0 0;color:#3A3029}
.vh-sub{font:400 clamp(.78rem,1.6vw,1.15rem)/1.6 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:#4A3E35;margin-top:1rem}
.vh-rule{width:110px;height:1px;background:#6B5A4C;margin:1.6rem auto 2rem}
.vh-tag{font:300 italic clamp(.95rem,1.6vw,1.15rem)/1.5 var(--sans);color:#4A3E35;margin-top:1.2rem}
.vh-icons{display:grid;grid-template-columns:repeat(4,auto);justify-content:center}
.vh-icons a{display:flex;flex-direction:column;align-items:center;gap:.8rem;text-decoration:none;padding:.4rem clamp(1rem,2.4vw,2.2rem);color:#3A3029;font:500 .78rem/1.35 var(--sans);letter-spacing:.12em;text-transform:uppercase;border-radius:var(--radius);transition:background .2s}
.vh-icons a + a{border-left:1px solid rgba(74,62,53,.35)}
.vh-icons a:hover{background:rgba(255,250,242,.55)}
.vh-icons .ico{width:34px;height:34px;stroke-width:1.2}
.vh-ctas{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;margin-top:2.4rem}
.vh-ctas .btn{border-color:#2E2620;color:#2E2620;background:rgba(255,250,242,.55)}
.vh-ctas .btn:hover{background:#2E2620;color:#FAF8F4}
.vh-ctas .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.vh-foot{margin-top:auto;padding-top:2rem;font-size:.75rem;letter-spacing:.08em;color:rgba(46,38,32,.75)}
@media (max-width:720px){.vh-icons{grid-template-columns:1fr 1fr;row-gap:1rem}.vh-icons a + a{border-left:0}.vh-icons a:nth-child(even){border-left:1px solid rgba(74,62,53,.35)}.landing{background-position:62% 30%}}
.hello{display:inline-flex;align-items:center;gap:.8rem;text-decoration:none;color:inherit;margin-top:.6rem;align-self:flex-start}
.hello .av{width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font:500 .85rem var(--sans);color:var(--clay);flex:none}
.hello b{display:block;font-weight:500;font-size:.92rem}
.hello small{display:block;color:var(--muted);font-size:.8rem}
.hello:hover b{text-decoration:underline}
.vh-promo{width:100%;max-width:1180px;margin-top:2.6rem;background:rgba(255,251,245,.84);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.6);border-radius:8px;padding:1.2rem;text-align:left;display:flex;flex-direction:column;gap:1rem}
.vh-promo-head{display:flex;align-items:center;gap:.8rem}
.vh-promo-head .av{width:40px;height:40px;border-radius:50%;background:#EFE6D8;display:flex;align-items:center;justify-content:center;font:500 .8rem var(--sans);color:#8C5A40;flex:none}
.vh-promo-head b{display:block;font-weight:500;font-size:.95rem}
.vh-promo-head small{display:block;color:#6B5E52;font-size:.8rem}
.vh-promo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.vh-card{display:grid;grid-template-columns:120px 1fr;gap:.9rem;align-items:center;text-decoration:none;color:#2E2620;background:rgba(255,255,255,.7);border-radius:6px;padding:.6rem;min-width:0;transition:background .2s}
.vh-card:hover{background:#fff}
.vh-card > *{min-width:0}
.vh-card .ph{aspect-ratio:4/3}
.vh-card b{display:block;font-weight:500;font-size:.9rem;line-height:1.3}
.vh-card p{font-size:.8rem;color:#5E5249;line-height:1.45;margin-top:.25rem}
.vh-card span.go{display:inline-block;margin-top:.35rem;font-size:.78rem;font-weight:500;color:#8C5A40}
@media (max-width:980px){.vh-promo-grid{grid-template-columns:1fr}}
@media (max-width:520px){.vh-card{grid-template-columns:84px 1fr}}
.velar{display:grid;grid-template-columns:6fr 5fr;gap:clamp(2rem,5vw,5rem);align-items:end}
.velar > *{min-width:0}
.velar-cols{display:grid;gap:0;border-top:1px solid var(--fg)}
.velar-cols > div{padding-block:1.2rem;border-bottom:1px solid var(--line);display:grid;grid-template-columns:120px 1fr;gap:1rem}
.velar-cols .n{font:500 1.05rem var(--sans);color:var(--clay)}
.velar-cols p{color:var(--muted);font-size:.93rem}
@media (max-width:820px){.velar{grid-template-columns:1fr}.velar-cols > div{grid-template-columns:1fr;gap:.3rem}}
.caption{font-size:.78rem;color:var(--muted);margin-top:.7rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}

.figures{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:clamp(2rem,4vw,3rem)}
.figure{padding:1.5rem 1.5rem 1.5rem 0;display:flex;flex-direction:column;gap:.5rem;min-width:0}
.figure + .figure{padding-left:1.5rem;border-left:1px solid var(--line)}
.figure b{font:300 2.3rem/1 var(--sans);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.figure span{color:var(--muted);font-size:.9rem}
.figure b .ten{background:var(--accent);color:var(--on-accent);font-size:inherit;padding:0 .18em;border-radius:2px}
@media (max-width:760px){.figures{grid-template-columns:1fr 1fr}.figure:nth-child(3){padding-left:0;border-left:0}.figure:nth-child(n+3){border-top:1px solid var(--line)}}

.services{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--fg)}
.service{padding:2rem 2rem 0 0;display:flex;flex-direction:column;gap:1rem;min-width:0}
.service + .service{padding-left:2rem;border-left:1px solid var(--line)}
.service p{color:var(--muted)}
.service .ico{width:28px;height:28px;color:var(--clay)}
@media (max-width:820px){.services{grid-template-columns:1fr}.service + .service{padding-left:0;border-left:0;border-top:1px solid var(--line);margin-top:2rem}}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5rem}
.step{display:flex;flex-direction:column;gap:.8rem;min-width:0}
.step .n{font:300 2.2rem/1 var(--sans);color:var(--clay)}
.step p{color:var(--muted)}
@media (max-width:820px){.steps{grid-template-columns:1fr}}

.panel-promo{display:grid;grid-template-columns:5fr 7fr;gap:4rem;align-items:center}
.panel-promo > *{min-width:0}
.checks{list-style:none;padding:0;margin:2rem 0 2.2rem;display:grid;gap:1rem}
.checks li{display:flex;gap:.8rem;align-items:flex-start}
.checks .ico{color:var(--clay);margin-top:3px}
.mock{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.mock-bar{display:flex;align-items:center;gap:.5rem;padding:.7rem 1rem;border-bottom:1px solid var(--line);font-size:.75rem;color:var(--muted)}
.mock-bar i{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.mock-body{display:grid;grid-template-columns:120px 1fr;min-height:320px}
.mock-side{border-right:1px solid var(--line);padding:1rem;display:flex;flex-direction:column;gap:.65rem;font-size:.75rem;color:var(--muted)}
.mock-side b{color:var(--fg);font-weight:500}
.mock-main{padding:1.2rem;display:grid;grid-template-columns:1fr 1fr;gap:.8rem;align-content:start}
.mock-card{border:1px solid var(--line);border-radius:var(--radius);padding:.9rem;font-size:.78rem;display:flex;flex-direction:column;gap:.5rem;background:var(--bg)}
.mock-card.wide{grid-column:span 2}
.mock-card small{color:var(--muted)}
@media (max-width:900px){.panel-promo{grid-template-columns:1fr;gap:2.5rem}}
@media (max-width:480px){.mock-body{grid-template-columns:1fr}.mock-side{display:none}.mock-main{grid-template-columns:1fr}.mock-card.wide{grid-column:auto}}

.founder{display:grid;grid-template-columns:4fr 8fr;gap:4rem;align-items:center}
.founder .portrait{aspect-ratio:1/1;max-width:340px}
.founder > *{min-width:0}
.portrait{aspect-ratio:4/5;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.portrait span{font:300 4.5rem/1 var(--sans);color:var(--clay);letter-spacing:-.04em}
.portrait small{position:absolute;bottom:1rem;left:1rem;right:1rem;font-size:.72rem;color:var(--muted)}
blockquote{margin:0;font:300 clamp(1.2rem,2vw,1.55rem)/1.45 var(--sans)}
.sig{margin-top:1.6rem;display:flex;flex-direction:column;gap:.2rem}
.sig b{font-weight:500}
.sig span{color:var(--muted);font-size:.9rem}
@media (max-width:820px){.founder{grid-template-columns:1fr;gap:2rem}.portrait{max-width:360px}}

.portfolio{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem}
.villa{display:flex;flex-direction:column;gap:.8rem;min-width:0}
.villa-meta{display:flex;justify-content:space-between;gap:1rem;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:.8rem}
.villa h3{font-size:1.15rem}
@media (max-width:820px){.portfolio{grid-template-columns:1fr}}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:4rem}
.ba figure{margin:0;min-width:0}
.ba figcaption{font-size:.8rem;color:var(--muted);margin-top:.6rem}
@media (max-width:620px){.ba{grid-template-columns:1fr}}

.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5rem}
.quote{display:flex;flex-direction:column;gap:1.2rem;min-width:0}
.quote p{font:300 1.02rem/1.6 var(--sans)}
.quote footer{font-size:.85rem;color:var(--muted)}
.quote footer b{color:var(--fg);font-weight:500;display:block}
.stars{color:var(--clay);letter-spacing:.15em;font-size:.8rem}
@media (max-width:820px){.quotes{grid-template-columns:1fr}}

.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;align-items:stretch}
.plan{border:1px solid var(--line);border-radius:var(--radius);padding:2rem;display:flex;flex-direction:column;gap:1.2rem;min-width:0;background:var(--bg)}

  s += `<rect width="1200" height="520" fill="var(--sky)"/>`;
  s += `<circle cx="${980 - i*160}" cy="120" r="46" fill="var(--sun)"/>`;
  s += `<path d="M0 330 C 200 250 380 290 560 260 S 900 230 1200 290 V520 H0Z" fill="var(--hill)"/>`;

  v.b.forEach(([x,y,w,h],k)=>{
    s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${k%2?'var(--wall-shade)':'var(--wall)'}"/>`;
    s += `<rect x="${x-14}" y="${y-8}" width="${w+28}" height="10" fill="var(--wall)"/>`;
    const n = Math.max(1, Math.floor(w/150));
    for(let j=0;j<n;j++){
      const gw = Math.min(110, w/n - 34), gx = x + 22 + j*(w/n), gy = y + h*0.35;
      s += `<rect x="${gx}" y="${gy}" width="${gw}" height="${h*0.62 - 8}" fill="var(--glass)" opacity=".82"/>`;
    }
    if(works){ for(let sx=x-10; sx<=x+w+10; sx+=60){ s += `<line x1="${sx}" y1="${y-30}" x2="${sx}" y2="${y+h}" stroke="var(--clay)" stroke-width="3"/>`; }

}

function formModal(title, body, ok, onSubmit, onReady){
  const m = document.createElement('div');
  m.className='modal'; m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true'); m.setAttribute('aria-label',title);
  m.innerHTML = `<div class="modal-box"><h3>${title}</h3><form novalidate>${body}<p class="note err" role="alert" style="margin:0;color:var(--alert)" hidden></p><div class="acts"><button type="button" class="btn" data-close>Cancelar</button><button class="btn btn-primary" type="submit">${ok}</button></div></form></div>`;
  document.body.appendChild(m);
  const close = ()=>m.remove(), f = m.querySelector('form');
  m.addEventListener('click',e=>{ if(e.target===m || e.target.closest('[data-close]')) close(); });
  f.addEventListener('submit',e=>{ e.preventDefault(); const err = onSubmit(f); if(err){ const n=f.querySelector('.err'); n.textContent=err; n.hidden=false; return; } close(); route(); });
  document.addEventListener('keydown', function k(e){ if(e.key==='Escape'){ close(); document.removeEventListener('keydown',k);} });
  onReady && onReady(f); const first=f.querySelector('input,select'); first && first.focus();
}

  formModal('Invitar cliente', `

      const n=f.querySelector('#cn').value.trim(), e=f.querySelector('#ce').value.trim().toLowerCase(); let pid=f.querySelector('#cp').value;
      if(!n) return 'Escribe el nombre del cliente.'; if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) return 'Escribe un email válido.';
      if(DB.clients.some(c=>c.email===e && c.prop===pid)) return 'Ese cliente ya tiene acceso a esta propiedad.';
      let pn;

function openModal(k){
  const [t,body,ok,done] = MODALS[k];
  const m = document.createElement('div');
  m.className='modal'; m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true'); m.setAttribute('aria-label',t);
  m.innerHTML = `<div class="modal-box"><h3>${t}</h3><form>${body}<div class="acts"><button type="button" class="btn" data-close>Cancelar</button><button class="btn btn-primary" type="submit">${ok}</button></div></form></div>`;
  document.body.appendChild(m);
  const close = ()=>m.remove();
  m.addEventListener('click',e=>{ if(e.target===m || e.target.closest('[data-close]')) close(); });
  m.querySelector('form').addEventListener('submit',e=>{ e.preventDefault(); close(); toast(done + ' (prototipo)'); });
  const f = m.querySelector('input,select,textarea'); f && f.focus();
  document.addEventListener('keydown', function esc(e){ if(e.key==='Escape'){ close(); document.removeEventListener('keydown',esc);} });
}
let toastT;
function toast(t){
  document.querySelectorAll('.toast').forEach(x=>x.remove());
  const el = document.createElement('div'); el.className='toast'; el.setAttribute('role','status');
  el.innerHTML = ico('check') + `<span>${t}</span>`;
  document.body.appendChild(el); clearTimeout(toastT); toastT = setTimeout(()=>el.remove(), 3200);
}
function today(){ return new Date().toLocaleDateString('es-ES'); }

/* ================= Eventos ================= */
function bind(h){
  const burger = $('#burger');
  if (burger) burger.addEventListener('click',()=>{ const n=$('#nav'); const o=n.classList.toggle('open'); burger.setAttribute('aria-expanded',o); });
  document.querySelectorAll('[data-jump]').forEach(a=>a.addEventListener('click',e=>{
    if (location.hash==='#inicio' || location.hash===''){ e.preventDefault(); $('#nav')?.classList.remove('open'); document.getElementById(a.dataset.jump)?.scrollIntoView({behavior:'smooth'}); }
    else { setTimeout(()=>document.getElementById(a.dataset.jump)?.scrollIntoView(), 50); }
  }));
  document.querySelectorAll('[data-jumpto]').forEach(a=>a.addEventListener('click',()=>{ state.jump=a.dataset.jumpto; }));
  const cf = $('#contactForm');
  if (cf) cf.addEventListener('submit',e=>{
    e.preventDefault();
    if(!$('#c-name').value.trim() || !$('#c-email').value.includes('@')){ toast('Escribe tu nombre y un email válido'); return; }
    if(!$('#c-ok').checked){ toast('Acepta la política de privacidad para enviar'); return; }
    cf.reset(); toast('Mensaje enviado. Francisco te responde en menos de 2 h (prototipo)');
  });
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{ state.loginTab=b.dataset.tab; store.set('lps-tab',state.loginTab); route(); }));
  const lf = $('#loginForm');
  if (lf) lf.addEventListener('submit', async e=>{ e.preventDefault();
    const email = $('#l-email').value.trim().toLowerCase(), pass = $('#l-pass').value;
    let hash = ''; try { hash = await sha256(email + ':' + pass); } catch(err) {}
    const acc = ACCOUNTS.find(a=>a.h===hash && a.role===state.loginTab);
    if (!acc) { $('#loginErr').hidden = false; $('#l-pass').value=''; $('#l-pass').focus(); return; }
    setSession({role:acc.role, name:acc.name, full:acc.full}, $('#l-keep').checked);
    location.hash = acc.role; });
  $('#logout2')?.addEventListener('click',()=>setSession(null));
  $('#forgot')?.addEventListener('click',e=>{ e.preventDefault(); toast('Te hemos enviado un enlace para crear una nueva contraseña (prototipo)'); });
  $('#logout')?.addEventListener('click',()=>{ setSession(null); location.hash='acceso'; });
  document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{ state.folder = state.folder===b.dataset.open?null:b.dataset.open; route(); }));
  document.querySelectorAll('[data-folder]').forEach(a=>a.addEventListener('click',()=>{ state.folder=a.dataset.folder; state.q=''; }));
  $('#closeFolder')?.addEventListener('click',()=>{ state.folder=null; route(); });
  const ds = $('#docSearch');
  if (ds){ ds.addEventListener('input',()=>{ state.q=ds.value; state.folder=null; const pos=ds.selectionStart; route(); const n=$('#docSearch'); n.focus(); n.setSelectionRange(pos,pos); }); }
  document.querySelectorAll('[data-dl]').forEach(b=>b.addEventListener('click',()=>toast(`Descarga de «${b.dataset.dl}» (prototipo)`)));
  document.querySelectorAll('[data-modal]').forEach(b=>b.addEventListener('click',()=>openModal(b.dataset.modal)));
  document.querySelectorAll('[data-budget]').forEach(r=>{
    const go=()=>{ state.budget=r.dataset.budget; route(); $('#budgetDetail')?.scrollIntoView({behavior:'smooth'}); };
    r.addEventListener('click',go); r.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  });
  document.querySelectorAll('[data-approve],[data-reject]').forEach(b=>b.addEventListener('click',()=>{
    const id = b.dataset.approve || b.dataset.reject, ok = !!b.dataset.approve;
    const bu = BUDGETS.find(x=>x.id===id); bu.status = ok?'Aprobado':'Rechazado'; bu.decided = today(); state.budget=id;
    if(ok){ const p = PROJECTS.find(x=>x.t===bu.title); if(p) p.s='En curso'; }
    route(); toast(ok?`Presupuesto ${id} aprobado. Francisco recibe el aviso.`:`Presupuesto ${id} rechazado. Francisco te contactará.`);
  }));
  document.querySelectorAll('[data-guide]').forEach(b=>b.addEventListener('click',()=>{ const role=h.startsWith('admin')?'admin':'cliente'; state.guide[role]=b.dataset.guide; state.folder=null; state.q=''; route(); }));
  document.querySelectorAll('.example a[href^="#cliente"], .example a[href^="#admin"]').forEach(a=>a.addEventListener('click',e=>{
    e.preventDefault(); const k=a.getAttribute('href').slice(1); const role=k.startsWith('admin')?'admin':'cliente';
    let sec = k.includes('-')?k.split('-')[1]:(role==='admin'?'panel':'resumen'); if(sec==='propiedad'||GUIDE[role].some(g=>g[0]===sec)){ state.guide[role]=sec; route(); }
  }));
  document.querySelectorAll('[data-rmodal]').forEach(b=>b.addEventListener('click',()=> b.dataset.rmodal==='property'?newPropertyModal():inviteModal()));
  document.querySelectorAll('[data-addclient]').forEach(b=>b.addEventListener('click',()=>inviteModal(b.dataset.addclient)));
  const bf = $('#bannerForm');
  if (bf) {
    bf.addEventListener('submit',e=>{ e.preventDefault();
      const list = promos().map((p,i)=>({on:$('#b'+i+'on').checked, img:$('#b'+i+'img').value, t:$('#b'+i+'t').value.trim()||p.t, d:$('#b'+i+'d').value.trim()}));
      try{ localStorage.setItem('lps-promos', JSON.stringify(list)); localStorage.setItem('lps-promo-head', JSON.stringify({t:$('#bh-t').value.trim()||'Novedades de Francisco', s:$('#bh-s').value.trim()})); }catch(err){}
      route(); toast('Banner guardado. Así lo verán tus clientes al entrar (en este navegador hasta tener backend)'); });
    $('#bannerReset').addEventListener('click',()=>{ try{ localStorage.removeItem('lps-promos'); localStorage.removeItem('lps-promo-head'); }catch(e){} route(); toast('Banner restaurado'); });
    bf.querySelectorAll('select[id$="img"]').forEach(sel=>sel.addEventListener('change',()=>{ const img=sel.closest('.card').querySelector('img.photo'); if(img) img.src=PH[sel.value]; }));
  }
  const comp = $('#composer');
  if (comp) comp.addEventListener('submit',e=>{ e.preventDefault(); const v=$('#msgInput').value.trim(); if(!v) return;
    const msg={me:true, who:(session()?.full||'Tú'), at:'Ahora', t:v.replace(/</g,'&lt;')};
    if (h.endsWith('guia')) MESSAGES.push(msg); else state.myMsgs.push(msg);
    route(); toast('Mensaje enviado'); });
}

route();
</script>

</body>
</html>
