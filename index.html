<style>
/* Layout: estudio de arquitectura. Blanco y negro, mucho aire, retícula de imágenes con pie en mayúsculas, cabecera mínima. */
:root{
  --bg:#FDFCFA;          /* blanco roto */
  --surface:#E9E4DA;     /* arena suave */
  --fg:#1F2B2E;          /* tierra oscura */
  --clay:#4E6A5F;        /* arcilla */
  --muted:#66706D;       /* olivo gris (AA sobre arena) */
  --line:#DCD6CA;
  --accent:#1F2B2E;      /* lima flúor: solo CTA, cifra 10, pendiente */
  --on-accent:#FFFFFF;
  --alert:#FF5A1F;       /* naranja neón: solo alertas privadas */
  --alert-bg:#FFE6DB;
  --card:#FBF9F5;
  /* ilustraciones */
  --sky:#E6DCCB; --hill:#CFC3A9; --hill2:#BDB094; --ground:#DDD2BE;
  --wall:#FBF8F2; --wall-shade:#E7DECF; --glass:#3B332D; --pool:#9DB8B2; --tree:#7D7A68; --sun:#E3B9A0;
  --serif:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sans:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:0px;
  --wrap:100%;
  --gutter:clamp(16px,5vw,112px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161D1F; --surface:#1F282B; --fg:#ECE8E0; --clay:#93B3A6; --muted:#A3AAA6; --line:#2E393C; --card:#1B2326; --accent:#ECE8E0; --on-accent:#161D1F;
  --alert-bg:#3A1F14;
  --sky:#2C2622; --hill:#3A332C; --hill2:#443C33; --ground:#332C26; --wall:#D9CFBF; --wall-shade:#BDB2A1; --glass:#2A2420; --pool:#5E7C77; --tree:#6F6C5C; --sun:#8A5A44;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161D1F; --surface:#1F282B; --fg:#ECE8E0; --clay:#93B3A6; --muted:#A3AAA6; --line:#2E393C; --card:#1B2326; --accent:#ECE8E0; --on-accent:#161D1F;
  --alert-bg:#3A1F14;
  --sky:#2C2622; --hill:#3A332C; --hill2:#443C33; --ground:#332C26; --wall:#D9CFBF; --wall-shade:#BDB2A1; --glass:#2A2420; --pool:#5E7C77; --tree:#6F6C5C; --sun:#8A5A44;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.65;font-weight:400;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit}
h1,h2,h3{font-family:var(--sans);font-weight:400;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:clamp(2rem,3.6vw,3.1rem)}
h2{font-size:clamp(1.6rem,2.6vw,2.3rem)}
h3{font-size:1.15rem;font-weight:500;letter-spacing:-.01em}
em{font-style:normal;color:var(--clay)}
p{margin:0}
:focus-visible{outline:2px solid var(--clay);outline-offset:3px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.eyebrow{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
.lead{font-size:1.02rem;color:var(--muted);max-width:56ch}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:.5rem;font:500 .92rem/1 var(--sans);padding:.95rem 1.4rem;border-radius:var(--radius);border:1px solid var(--fg);background:transparent;color:var(--fg);text-decoration:none;cursor:pointer;transition:background .2s,color .2s}
.btn:hover{background:var(--fg);color:var(--bg)}
.btn-primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn-primary:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.btn-sm{padding:.6rem .95rem;font-size:.84rem}
.link{color:var(--clay);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px;font-weight:500;font-size:.95rem}
.link:hover{color:var(--fg)}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Cabecera pública ---------- */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.site-header .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;height:72px}
.logo{font-family:"Cormorant Garamond",Garamond,"Times New Roman",serif;font-weight:500;font-size:1.65rem;line-height:1;text-decoration:none;letter-spacing:0;white-space:nowrap}

.nav{display:flex;align-items:center;gap:1.8rem}
.nav a{text-decoration:none;font-size:.9rem}
.nav a.on{border-bottom:1px solid var(--fg)}
.nav .access{background:var(--accent);color:var(--on-accent);display:inline-flex;gap:.4rem;align-items:center;padding:.45rem .8rem;border-radius:var(--radius);font-weight:500}
.nav .access:hover{background:var(--fg);color:var(--accent)}
.burger{display:none;background:none;border:0;color:var(--fg);padding:.5rem;cursor:pointer}
@media (max-width:920px){
  .nav{position:fixed;inset:72px 0 auto 0;top:calc(72px + env(safe-area-inset-top,0px));flex-direction:column;align-items:flex-start;gap:1.2rem;background:var(--bg);border-bottom:1px solid var(--line);padding:1.5rem max(16px,env(safe-area-inset-right,0px)) 2rem max(16px,env(safe-area-inset-left,0px));display:none}
  .nav.open{display:flex}
  .nav a{font-size:1.1rem}
  .burger{display:block}
}

/* ---------- Secciones ---------- */
section.band{padding-block:clamp(4rem,9vw,7.5rem)}

.illus{display:block;width:100%;height:auto;max-width:100%;border-radius:var(--radius)}
.ph{max-width:100%;overflow:hidden;border-radius:var(--radius);background:var(--surface)}
img.photo{display:block;width:100%;height:100%;max-width:100%;object-fit:cover}
.works{display:grid;grid-template-columns:5fr 4fr 4fr;grid-template-rows:auto auto;gap:1.2rem}
.works figure{margin:0;display:flex;flex-direction:column;gap:.6rem;min-width:0}
.works figure .ph{flex:1}
.works figcaption{font-size:.85rem;color:var(--muted)}
.works figcaption b{display:block;color:var(--fg);font-weight:500}
.works .tall{grid-row:span 2}
.works .wide{grid-column:span 2}
@media (max-width:820px){.works{grid-template-columns:1fr 1fr}.works .tall{grid-row:auto;grid-column:span 2}.works .wide{grid-column:span 2}}
@media (max-width:520px){.works{grid-template-columns:1fr}.works .tall,.works .wide{grid-column:auto}}
.case{display:grid;grid-template-columns:7fr 4fr;gap:1.2rem}
.case > *{min-width:0}
.case figure{margin:0}
.case-main .ph{height:100%}
.case-side{display:grid;gap:1.2rem}
.case-meta{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--fg);margin-top:1.6rem}

@media (max-width:820px){.case{grid-template-columns:1fr}.case-side{grid-template-columns:1fr 1fr}.case-meta{grid-template-columns:1fr}.case-meta > div + div{padding-left:0;border-left:0}}
.page-img{margin-top:2.5rem}
.detail,#svc-planes{scroll-margin-top:90px}

.landing::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 48% 42% at 50% 36%,rgba(250,240,228,.6),rgba(250,240,228,0) 100%),linear-gradient(180deg,rgba(250,240,228,.3) 0%,rgba(250,240,228,0) 70%);pointer-events:none}
.landing > *{position:relative}
.vh-logo{width:min(560px,86vw);height:auto;display:block}
.vh-word{font-family:"Cormorant Garamond",Garamond,"Times New Roman",serif;font-weight:500;font-size:clamp(3.4rem,9vw,6.2rem);line-height:.95;letter-spacing:-.01em;margin:-.15em 0 0;color:#3A3029}

@media (max-width:720px){.vh-icons{grid-template-columns:1fr 1fr;row-gap:1rem}.vh-icons a + a{border-left:0}.vh-icons a:nth-child(even){border-left:1px solid rgba(74,62,53,.35)}.landing{background-position:62% 30%}}
.hello{display:inline-flex;align-items:center;gap:.8rem;text-decoration:none;color:inherit;margin-top:.6rem;align-self:flex-start}

.m-claim{padding-block:clamp(1.8rem,3.5vw,2.8rem);text-align:center}

@media (max-width:760px){.m-tiles{grid-template-columns:1fr}.m-tile{aspect-ratio:16/10}.m-mosaic{grid-template-columns:1fr 1fr;grid-template-rows:auto auto;height:auto}.m-mosaic figure:first-child{grid-column:span 2;grid-row:auto;aspect-ratio:4/3}.m-mosaic figure{aspect-ratio:1/1}}

.services{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--fg)}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5rem}
.step{display:flex;flex-direction:column;gap:.8rem;min-width:0}
.step .n{font:300 2.2rem/1 var(--sans);color:var(--clay)}
.step p{color:var(--muted)}
@media (max-width:820px){.steps{grid-template-columns:1fr}}

.panel-promo{display:grid;grid-template-columns:5fr 7fr;gap:4rem;align-items:center}
.panel-promo > *{min-width:0}
.checks{list-style:none;padding:0;margin:2rem 0 2.2rem;display:grid;gap:1rem}
.checks li{display:flex;gap:.8rem;align-items:flex-start}
.checks .ico{color:var(--clay);margin-top:3px}
.mock{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.mock-bar{display:flex;align-items:center;gap:.5rem;padding:.7rem 1rem;border-bottom:1px solid var(--line);font-size:.75rem;color:var(--muted)}
.mock-bar i{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.mock-body{display:grid;grid-template-columns:120px 1fr;min-height:320px}
.mock-side{border-right:1px solid var(--line);padding:1rem;display:flex;flex-direction:column;gap:.65rem;font-size:.75rem;color:var(--muted)}
.mock-side b{color:var(--fg);font-weight:500}
.mock-main{padding:1.2rem;display:grid;grid-template-columns:1fr 1fr;gap:.8rem;align-content:start}
.mock-card{border:1px solid var(--line);border-radius:var(--radius);padding:.9rem;font-size:.78rem;display:flex;flex-direction:column;gap:.5rem;background:var(--bg)}
.mock-card.wide{grid-column:span 2}
.mock-card small{color:var(--muted)}
@media (max-width:900px){.panel-promo{grid-template-columns:1fr;gap:2.5rem}}
@media (max-width:480px){.mock-body{grid-template-columns:1fr}.mock-side{display:none}.mock-main{grid-template-columns:1fr}.mock-card.wide{grid-column:auto}}

.founder{display:grid;grid-template-columns:4fr 8fr;gap:4rem;align-items:center}
.founder .portrait{aspect-ratio:1/1;max-width:340px}
.founder > *{min-width:0}
.portrait{aspect-ratio:4/5;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.portrait span{font:300 4.5rem/1 var(--sans);color:var(--clay);letter-spacing:-.04em}
.portrait small{position:absolute;bottom:1rem;left:1rem;right:1rem;font-size:.72rem;color:var(--muted)}
blockquote{margin:0;font:300 clamp(1.2rem,2vw,1.55rem)/1.45 var(--sans)}
.sig{margin-top:1.6rem;display:flex;flex-direction:column;gap:.2rem}
.sig b{font-weight:500}
.sig span{color:var(--muted);font-size:.9rem}
@media (max-width:820px){.founder{grid-template-columns:1fr;gap:2rem}.portrait{max-width:360px}}

.portfolio{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem}
.villa{display:flex;flex-direction:column;gap:.8rem;min-width:0}
.villa-meta{display:flex;justify-content:space-between;gap:1rem;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:.8rem}
.villa h3{font-size:1.15rem}
@media (max-width:820px){.portfolio{grid-template-columns:1fr}}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:4rem}
.ba figure{margin:0;min-width:0}
.ba figcaption{font-size:.8rem;color:var(--muted);margin-top:.6rem}
@media (max-width:620px){.ba{grid-template-columns:1fr}}

.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5rem}
.quote{display:flex;flex-direction:column;gap:1.2rem;min-width:0}
.quote p{font:300 1.02rem/1.6 var(--sans)}
.quote footer{font-size:.85rem;color:var(--muted)}
.quote footer b{color:var(--fg);font-weight:500;display:block}
.stars{color:var(--clay);letter-spacing:.15em;font-size:.8rem}
@media (max-width:820px){.quotes{grid-template-columns:1fr}}

.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;align-items:stretch}
.plan{border:1px solid var(--line);border-radius:var(--radius);padding:2rem;display:flex;flex-direction:column;gap:1.2rem;min-width:0;background:var(--bg)}
.plan.vip{border:1px solid var(--fg);position:relative}
.plan .tag{position:absolute;top:-.7rem;left:2rem;background:var(--bg);padding:0 .6rem;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase}
.plan .price{font:300 2.4rem/1 var(--sans);letter-spacing:-.02em}
.plan .price small{font-size:.85rem;color:var(--muted);letter-spacing:0}
.plan ul{list-style:none;padding:0;margin:0;display:grid;gap:.7rem;font-size:.93rem;flex:1}
.plan li{display:flex;gap:.6rem;align-items:flex-start}
.plan li .ico{width:16px;height:16px;margin-top:4px;color:var(--clay)}
.plan .visits{font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:1rem}
.note{font-size:.82rem;color:var(--muted);margin-top:1.5rem}
@media (max-width:900px){.plans{grid-template-columns:1fr}}

.cta-band{display:flex;justify-content:space-between;align-items:center;gap:2rem;flex-wrap:wrap}
.cta-band h2{max-width:18ch}

.site-footer{border-top:1px solid var(--line);padding-block:4rem 2.5rem;font-size:.88rem}
.foot-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:2rem}
.foot-grid > *{min-width:0}
.foot-grid h4{font:500 .72rem/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 1rem}
.foot-grid ul{list-style:none;padding:0;margin:0;display:grid;gap:.5rem}
.foot-grid a{text-decoration:none}
.foot-grid a:hover{text-decoration:underline}
.legal{margin-top:3rem;padding-top:1.5rem;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;color:var(--muted);font-size:.8rem}
.legal nav{display:flex;gap:1.2rem;flex-wrap:wrap}
@media (max-width:820px){.foot-grid{grid-template-columns:1fr 1fr}}

/* Páginas internas */
.page-head{padding-block:clamp(1.6rem,3.5vw,2.8rem) clamp(2rem,4vw,3rem);border-bottom:1px solid var(--line)}
.page-head .wrap:has(.page-img){display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);column-gap:clamp(2rem,5vw,5rem);align-items:center}
.page-head .wrap:has(.page-img){grid-template-rows:1fr auto auto auto 1fr}
.page-head .wrap:has(.page-img) > *{grid-column:1}
.page-head .wrap:has(.page-img) > :nth-child(1){grid-row:2}
.page-head .wrap:has(.page-img) > :nth-child(2){grid-row:3}
.page-head .wrap:has(.page-img) > :nth-child(3){grid-row:4}
.page-head .wrap:has(.page-img) > .page-img{grid-column:2;grid-row:1 / 6;margin:0;align-self:center}
.page-head .page-img .ph{border-radius:6px;overflow:hidden}
.page-head .page-img.tall{max-width:440px;justify-self:end;width:100%}
@media (max-width:820px){.page-head .wrap:has(.page-img){display:block}.page-head .page-img{margin-top:2rem}.page-head .page-img.tall{max-width:none}}
.page-head h1{font-size:clamp(1.9rem,3.4vw,2.9rem);max-width:22ch;margin-block:1rem 1.2rem}
.detail{display:grid;grid-template-columns:4fr 8fr;gap:3rem;padding-block:3.5rem;border-bottom:1px solid var(--line)}
.detail > *{min-width:0}
.detail .lists{display:grid;grid-template-columns:1fr 1fr;gap:2rem}
.detail h4{margin:0 0 .8rem;font:500 .72rem/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.detail ul{margin:0;padding-left:1.1rem;display:grid;gap:.45rem}
.detail p{color:var(--muted);margin-top:1rem;max-width:46ch}
@media (max-width:820px){.detail{grid-template-columns:1fr}.detail .lists{grid-template-columns:1fr}}
.team{display:grid;grid-template-columns:repeat(4,1fr);gap:2rem}
.member{display:flex;flex-direction:column;gap:.7rem;min-width:0}
.member .portrait span{font-size:3rem}
.member b{font-weight:500}
.member span.r{color:var(--muted);font-size:.88rem}
@media (max-width:820px){.team{grid-template-columns:1fr 1fr}}
.zones{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--fg)}
.zone{padding:1.5rem 1rem 0 0;min-width:0}
.zone + .zone{padding-left:1rem;border-left:1px solid var(--line)}
.zone b{font:500 1.1rem/1.2 var(--sans);display:block;margin-bottom:.4rem}
.zone span{color:var(--muted);font-size:.88rem}
@media (max-width:760px){.zones{grid-template-columns:1fr 1fr}.zone:nth-child(3){padding-left:0;border-left:0}.zone{padding-bottom:1.5rem}}
.values{display:grid;gap:0;border-top:1px solid var(--line)}
.values div{display:grid;grid-template-columns:200px 1fr;gap:2rem;padding-block:1.4rem;border-bottom:1px solid var(--line)}
.values b{font:500 1.1rem/1.2 var(--sans)}
.values span{color:var(--muted)}
@media (max-width:620px){.values div{grid-template-columns:1fr;gap:.3rem}}
.timeline{list-style:none;padding:0;margin:2rem 0 0;display:grid;gap:1.2rem}
.timeline li{display:grid;grid-template-columns:70px 1fr;gap:1rem}
.timeline b{font-variant-numeric:tabular-nums;font-weight:500;color:var(--clay)}

/* Formularios */
.contact{display:grid;grid-template-columns:7fr 5fr;gap:4rem;padding-block:3.5rem 5rem}
.contact > *{min-width:0}
form.grid{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem}
form.grid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:.45rem;min-width:0}
.field label{font-size:.78rem;letter-spacing:.06em;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{font:400 1rem/1.4 var(--sans);color:var(--fg);background:transparent;border:0;border-bottom:1px solid var(--line);padding:.6rem 0;border-radius:0;width:100%}
.field textarea{resize:vertical;min-height:110px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-bottom-color:var(--fg)}
.field select option{background:var(--bg);color:var(--fg)}
.check{display:flex;gap:.7rem;align-items:flex-start;font-size:.85rem;color:var(--muted)}
.check input{margin-top:.25rem;accent-color:var(--clay)}
.contact-side{display:flex;flex-direction:column;gap:2rem}
.contact-side .item{border-top:1px solid var(--line);padding-top:1.1rem;display:flex;flex-direction:column;gap:.3rem}
.contact-side .item span{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.contact-side .item b{font-weight:400;font-size:1.1rem;user-select:all}
@media (max-width:820px){.contact{grid-template-columns:1fr}form.grid{grid-template-columns:1fr}}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.login > *{min-width:0}
.login-art{background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;padding:2.5rem;gap:2rem}
.login-art .illus{border-radius:var(--radius)}
.login-form{display:flex;flex-direction:column;justify-content:center;padding-block:3rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-box{width:100%;max-width:400px;margin:0 auto;display:flex;flex-direction:column;gap:1.6rem}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--radius);padding:3px}
.tabs button{font:500 .88rem/1 var(--sans);padding:.75rem;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:2px}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.login-box form{display:grid;gap:1.3rem}
.login-box .row{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;gap:1rem;flex-wrap:wrap}
.invite{font-size:.83rem;color:var(--muted);border-top:1px solid var(--line);padding-top:1.2rem;display:flex;gap:.6rem}
.invite .ico{width:16px;height:16px;margin-top:3px}
.back{font-size:.85rem;color:var(--muted);text-decoration:none;display:inline-flex;gap:.4rem;align-items:center}
@media (max-width:820px){.login{grid-template-columns:1fr}.login-art{display:none}}

/* ---------- Área privada ---------- */
.app{display:grid;grid-template-columns:clamp(220px,15vw,280px) 1fr;min-height:100vh}
.app > *{min-width:0}
.side{border-right:1px solid var(--line);padding:1.6rem 1.2rem;display:flex;flex-direction:column;gap:2rem;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;background:var(--bg)}
.side .logo{font-size:1.5rem}
.side nav{display:flex;flex-direction:column;gap:.15rem}
.side nav a{display:flex;gap:.75rem;align-items:center;padding:.6rem .7rem;border-radius:var(--radius);text-decoration:none;font-size:.9rem;color:var(--muted)}
.side nav a:hover{color:var(--fg);background:var(--surface)}
.side nav a.on{color:var(--fg);background:var(--surface);font-weight:500}
.side nav a .ico{width:18px;height:18px}
.side .out{margin-top:auto;display:flex;flex-direction:column;gap:.8rem;font-size:.85rem}
.side .out button{background:none;border:0;color:var(--muted);font:inherit;padding:0;cursor:pointer;display:flex;gap:.6rem;align-items:center}
.side .out button:hover{color:var(--fg)}
.main{padding:2rem clamp(1rem,3vw,2.8rem) 4rem;padding-left:max(clamp(1rem,3vw,2.8rem),env(safe-area-inset-left,0px));padding-right:max(clamp(1rem,3vw,2.8rem),env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:2rem}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding-bottom:1.5rem;border-bottom:1px solid var(--line)}
.topbar:has(.topbar-mid){display:grid;grid-template-columns:1fr auto 1fr}.topbar:has(.topbar-mid)>div:last-child{justify-self:end}
@media(max-width:700px){.topbar:has(.topbar-mid){grid-template-columns:1fr auto}.topbar-mid{grid-row:2;justify-self:start}}
.topbar h1{font-size:clamp(1.6rem,2.6vw,2.1rem)}
.who{display:flex;align-items:center;gap:.8rem;font-size:.85rem}
.who .av{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font:500 .85rem/1 var(--sans);color:var(--clay);flex:none}
.who small{display:block;color:var(--muted);font-size:.75rem}
.demo{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);padding:.3rem .6rem;border-radius:2px}
.mobile-nav{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mobile-nav{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.4rem;scrollbar-width:none;margin-bottom:-1rem}
  .mobile-nav a{flex:none;font-size:.82rem;text-decoration:none;padding:.45rem .8rem;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
  .mobile-nav a.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2rem}
.grid2 > *,.grid3 > *,.grid4 > *{min-width:0}
@media (max-width:1100px){.grid4{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.4rem;display:flex;flex-direction:column;gap:.9rem}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:.8rem}
.card-h h3{font-size:1.1rem}
.card-h .eyebrow{font-size:.68rem}
.kpi b{font:300 2.6rem/1 var(--sans);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi b small{font-size:1.1rem;color:var(--muted);letter-spacing:0}
.kpi span{color:var(--muted);font-size:.85rem}
.bar{height:6px;background:var(--surface);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--fg);border-radius:3px}
.cap{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.cap i{height:10px;border-radius:2px;background:var(--surface);border:1px solid var(--line)}
.cap i.f{background:var(--fg);border-color:var(--fg)}
.chip{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:500;padding:.25rem .55rem;border-radius:2px;border:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.chip.pend{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.ok{color:var(--fg);border-color:var(--fg)}
.chip.no{text-decoration:line-through}
.chip.prog{color:var(--clay);border-color:var(--clay)}
.chip.alert{background:var(--alert);border-color:var(--alert);color:#1E1A17}
.alertbox{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--alert-bg);border:1px solid var(--alert);border-left-width:4px;border-radius:var(--radius);padding:1rem 1.2rem;font-size:.92rem}
.alertbox .ico{color:var(--alert)}
.alertbox > div{display:flex;gap:.8rem;align-items:center;min-width:0}
.list{display:flex;flex-direction:column}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.85rem 0;border-top:1px solid var(--line);font-size:.9rem}
.list .it:first-child{border-top:0}
.list .it > div{min-width:0}
.list .it small{display:block;color:var(--muted);font-size:.78rem}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:620px}

tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface)}
.toolbar{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;justify-content:space-between}
.toolbar .actions{display:flex;gap:.6rem;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:.5rem;border:1px solid var(--line);border-radius:var(--radius);padding:.55rem .8rem;background:var(--card);min-width:0;flex:1 1 220px;max-width:360px}
.search input{border:0;background:transparent;font:400 .9rem var(--sans);color:var(--fg);width:100%;outline:none}

.folders{display:grid;grid-template-columns:repeat(5,1fr);gap:1rem}
.folder{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.2rem;display:flex;flex-direction:column;gap:1.4rem;cursor:pointer;text-align:left;font:inherit;color:inherit;min-width:0}

.folder .ico{width:26px;height:26px;color:var(--clay)}

.folder small{color:var(--muted);font-size:.78rem}
@media (max-width:1100px){.folders{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.folders{grid-template-columns:1fr 1fr}}
.file{display:flex;align-items:center;gap:.8rem;min-width:0}
.file .ico{color:var(--muted)}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{background:none;border:1px solid var(--line);border-radius:var(--radius);color:var(--fg);padding:.4rem .55rem;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;font:500 .78rem var(--sans)}
.iconbtn:hover{border-color:var(--fg)}
.iconbtn .ico{width:15px;height:15px}
.diary{display:flex;flex-direction:column;gap:0;border-left:1px solid var(--line);margin-left:6px}
.entry{position:relative;padding:0 0 1.8rem 1.6rem;display:grid;grid-template-columns:1fr 180px;gap:1rem}
.entry > *{min-width:0}
.entry::before{content:"";position:absolute;left:-5px;top:.45rem;width:9px;height:9px;border-radius:50%;background:var(--bg);border:1px solid var(--fg)}
.entry time{font-size:.75rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.entry p{font-size:.92rem;margin-top:.3rem}
@media (max-width:600px){.entry{grid-template-columns:1fr}}
.phases{display:flex;gap:0;font-size:.75rem}
.phases span{flex:1;padding:.5rem .6rem;border:1px solid var(--line);color:var(--muted);text-align:center;margin-left:-1px}

const VILLAS = [
  {b:[[150,250,380,170],[530,180,330,240],[860,290,210,130]], pool:[230,440,560,34], t:[[95,330,55],[1110,315,70]]},

function villa(i=0, opt={}){
  const v = VILLAS[i % VILLAS.length], works = !!opt.works, ratio = opt.ratio || '1200 520';
  let s = `<svg class="illus" viewBox="0 0 ${ratio}" role="img" aria-label="${opt.alt||'Ilustración de villa mediterránea'}" preserveAspectRatio="xMidYMid slice">`;
  s += `<rect width="1200" height="520" fill="var(--sky)"/>`;
  s += `<circle cx="${980 - i*160}" cy="120" r="46" fill="var(--sun)"/>`;
  s += `<path d="M0 330 C 200 250 380 290 560 260 S 900 230 1200 290 V520 H0Z" fill="var(--hill)"/>`;
  s += `<path d="M0 380 C 260 330 520 360 760 340 S 1050 330 1200 360 V520 H0Z" fill="var(--hill2)"/>`;
  s += `<rect y="420" width="1200" height="100" fill="var(--ground)"/>`;
  v.t.forEach(([x,y,r])=>{ s += `<rect x="${x-3}" y="${y}" width="6" height="${420-y}" fill="var(--tree)"/><circle cx="${x}" cy="${y}" r="${r}" fill="var(--tree)"/>`; });
  v.b.forEach(([x,y,w,h],k)=>{
    s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${k%2?'var(--wall-shade)':'var(--wall)'}"/>`;
    s += `<rect x="${x-14}" y="${y-8}" width="${w+28}" height="10" fill="var(--wall)"/>`;
    const n = Math.max(1, Math.floor(w/150));
    for(let j=0;j<n;j++){
      const gw = Math.min(110, w/n - 34), gx = x + 22 + j*(w/n), gy = y + h*0.35;
      s += `<rect x="${gx}" y="${gy}" width="${gw}" height="${h*0.62 - 8}" fill="var(--glass)" opacity=".82"/>`;
    }
    if(works){ for(let sx=x-10; sx<=x+w+10; sx+=60){ s += `<line x1="${sx}" y1="${y-30}" x2="${sx}" y2="${y+h}" stroke="var(--clay)" stroke-width="3"/>`; }
      for(let sy=y; sy<=y+h; sy+=55){ s += `<line x1="${x-10}" y1="${sy}" x2="${x+w+10}" y2="${sy}" stroke="var(--clay)" stroke-width="3"/>`; } }
  });
  const [px,py,pw,ph] = v.pool;
  s += `<rect x="${px}" y="${py}" width="${pw}" height="${ph}" fill="${works?'var(--hill2)':'var(--pool)'}"/>`;
  if(!works) s += `<line x1="${px+30}" y1="${py+12}" x2="${px+pw*0.45}" y2="${py+12}" stroke="var(--wall)" stroke-width="2" opacity=".6"/>`;
  return s + `</svg>`;
}

const SLOT_PAGES = {inicio:'INICIO', servicios:'SERVICIOS', sobre:'SOBRE', contacto:'CONTACTO', acceso:'ACCESO'};
const slotState = {page:'', n:0, list:[]};
function slotSvg(code, label){
  const t = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect x="14" y="14" width="1172" height="772" fill="none" stroke="#000" stroke-opacity=".28" stroke-width="3" stroke-dasharray="14 10"/><text x="600" y="400" text-anchor="middle" font-family="Poppins,Helvetica,Arial,sans-serif" font-size="96" letter-spacing="6" fill="#000" fill-opacity=".72">${t(code)}</text><text x="600" y="470" text-anchor="middle" font-family="Poppins,Helvetica,Arial,sans-serif" font-size="34" letter-spacing="4" fill="#000" fill-opacity=".5">${t(label.toUpperCase())}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function slotify(scope){
  (scope||document).querySelectorAll('#root img:not(.slot-ph)').forEach(img=>{
    const src = img.getAttribute('src')||'';
    if (/^(data|blob):/.test(src)) return;
    const n = ++slotState.n, code = `${slotState.page} ${String(n).padStart(2,'0')}`;
    const label = (img.dataset.slot||'').trim() || (img.getAttribute('alt')||'').split(' · ')[0] || 'Foto';
    slotState.list.push({code, label, antes: src});
    img.src = slotSvg(code, label); img.classList.add('slot-ph'); img.removeAttribute('srcset');
    img.title = code + ' · ' + label;
  });
}

function bindAds(){
  clearInterval(state.adTimer);
  const box = $('#vhAds'); if(!box) return;
  const track = box.querySelector('.vh-ads-track'), dots=[...box.querySelectorAll('.vh-dots button')], n=track.children.length;
  if(n<2) return;
  const cur = () => Math.round(track.scrollLeft / track.clientWidth);
  const go = i => track.scrollTo({left:((i+n)%n)*track.clientWidth});
  track.addEventListener('scroll',()=>{ const c=cur(); dots.forEach((d,i)=>d.setAttribute('aria-current', i===c?'true':'false')); },{passive:true});
  dots.forEach((d,i)=>d.addEventListener('click',()=>go(i)));
  /* Cambia solo cada 3 s aunque el ratón esté encima (el banner ocupa casi toda la pantalla) */
  let paused=false; box.addEventListener('focusin',e=>{ if(e.target.matches(':focus-visible')) paused=true; }); box.addEventListener('focusout',()=>paused=false);
  state.adTimer = setInterval(()=>{ if(!paused && document.contains(track)) go(cur()+1); }, 3000);
}

function formModal(title, body, ok, onSubmit, onReady){
  const m = document.createElement('div');
  m.className='modal'; m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true'); m.setAttribute('aria-label',title);
  m.innerHTML = `<div class="modal-box"><h3>${title}</h3><form novalidate>${body}<p class="note err" role="alert" style="margin:0;color:var(--alert)" hidden></p><div class="acts"><button type="button" class="btn" data-close>Cancelar</button><button class="btn btn-primary" type="submit">${ok}</button></div></form></div>`;
  document.body.appendChild(m);
  const close = ()=>m.remove(), f = m.querySelector('form');
  m.addEventListener('click',e=>{ if(e.target===m || e.target.closest('[data-close]')) close(); });
  f.addEventListener('submit',e=>{ e.preventDefault(); const err = onSubmit(f); if(err){ const n=f.querySelector('.err'); n.textContent=err; n.hidden=false; return; } close(); route(); });
  document.addEventListener('keydown', function k(e){ if(e.key==='Escape'){ close(); document.removeEventListener('keydown',k);} });

function shrinkImage(file, max=2400){ return new Promise((ok,ko)=>{ const r=new FileReader(); r.onerror=ko; r.onload=()=>{ const im=new Image(); im.onerror=ko; im.onload=()=>{ const k=Math.min(1, max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height); ok(c.toDataURL('image/jpeg',.86)); }; im.src=r.result; }; r.readAsDataURL(file); }); }

/* ================= Modales y toast ================= */
const MODALS = {
  invite:['Invitar cliente',`<div class="field"><label for="m1">Nombre</label><input id="m1" placeholder="Nombre y apellidos"></div><div class="field"><label for="m2">Email</label><input id="m2" type="email" placeholder="cliente@email.com"></div><div class="field"><label for="m3">Propiedad</label><select id="m3">${PROPS.map(p=>`<option>${p[0]}</option>`).join('')}</select></div>`,'Enviar invitación','Invitación enviada'],
  upload:['Subir documento',`<div class="field"><label for="m4">Propiedad</label><select id="m4">${PROPS.map(p=>`<option>${p[0]}</option>`).join('')}</select></div><div class="field"><label for="m5">Carpeta</label><select id="m5">${FOLDERS.map(f=>`<option>${f}</option>`).join('')}</select></div><div class="field"><label for="m6">Archivo (PDF o imagen)</label><input id="m6" type="file" accept=".pdf,image/*"></div><label class="check" for="m7"><input id="m7" type="checkbox" checked> Avisar al cliente por email</label>`,'Subir','Documento subido'],
  folder:['Nueva carpeta',`<div class="field"><label for="m8">Nombre de la carpeta</label><input id="m8" placeholder="Por ejemplo: Seguros"></div>`,'Crear carpeta','Carpeta creada'],
  budget:['Nuevo presupuesto',`<div class="field"><label for="m9">Propiedad</label><select id="m9">${PROPS.map(p=>`<option>${p[0]}</option>`).join('')}</select></div><div class="field"><label for="m10">Concepto</label><input id="m10" placeholder="Por ejemplo: Sustitución de toldos"></div><div class="field"><label for="m11">Importe sin IVA (€)</label><input id="m11" inputmode="decimal" placeholder="0"></div><div class="field"><label for="m12">PDF del presupuesto</label><input id="m12" type="file" accept=".pdf"></div>`,'Enviar al cliente','Presupuesto enviado al cliente'],
  progress:['Publicar avance de obra',`<div class="field"><label for="m13">Obra</label><select id="m13">${WORKS.filter(w=>w.phase==='En curso').map(w=>`<option>${w.title} · ${w.prop}</option>`).join('')}</select></div><div class="field"><label for="m14">Avance (%)</label><input id="m14" type="number" min="0" max="100" value="70"></div><div class="field"><label for="m15">Nota para el cliente</label><textarea id="m15" placeholder="Qué se ha hecho esta semana"></textarea></div><div class="field"><label for="m16">Fotos</label><input id="m16" type="file" accept="image/*" multiple></div>`,'Publicar','Avance publicado'],
  project:['Nuevo proyecto',`<div class="field"><label for="m17">Propiedad</label><select id="m17">${PROPS.map(p=>`<option>${p[0]}</option>`).join('')}</select></div><div class="field"><label for="m18">Nombre</label><input id="m18"></div><div class="field"><label for="m19">Descripción</label><textarea id="m19"></textarea></div>`,'Crear proyecto','Proyecto creado'],
  property:['Añadir propiedad',`<div class="field"><label for="m20">Nombre de la villa</label><input id="m20"></div><div class="field"><label for="m21">Zona</label><select id="m21"><option>Marbella</option><option>Nueva Andalucía</option><option>Benahavís</option><option>San Pedro</option></select></div><p class="note" style="margin:0">Quedan 2 plazas en tu cartera de 10.</p>`,'Añadir','Propiedad añadida'],
};
function openModal(k){
  const [t,body,ok,done] = MODALS[k];
  const m = document.createElement('div');
  m.className='modal'; m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true'); m.setAttribute('aria-label',t);
  m.innerHTML = `<div class="modal-box"><h3>${t}</h3><form>${body}<div class="acts"><button type="button" class="btn" data-close>Cancelar</button><button class="btn btn-primary" type="submit">${ok}</button></div></form></div>`;
  document.body.appendChild(m);
  const close = ()=>m.remove();
  m.addEventListener('click',e=>{ if(e.target===m || e.target.closest('[data-close]')) close(); });
  m.querySelector('form').addEventListener('submit',e=>{ e.preventDefault(); close(); toast(done + ' (prototipo)'); });
  const f = m.querySelector('input,select,textarea'); f && f.focus();
  document.addEventListener('keydown', function esc(e){ if(e.key==='Escape'){ close(); document.removeEventListener('keydown',esc);} });
}
let toastT;
function toast(t){
  document.querySelectorAll('.toast').forEach(x=>x.remove());
  const el = document.createElement('div'); el.className='toast'; el.setAttribute('role','status');
  el.innerHTML = ico('check') + `<span>${t}</span>`;
  document.body.appendChild(el); clearTimeout(toastT); toastT = setTimeout(()=>el.remove(), 3200);
}
function today(){ return new Date().toLocaleDateString('es-ES'); }

/* ================= Eventos ================= */
function bind(h){
  const burger = $('#burger');
  if (burger) burger.addEventListener('click',()=>{ const n=$('#nav'); const o=n.classList.toggle('open'); burger.setAttribute('aria-expanded',o); });
  document.querySelectorAll('[data-jump]').forEach(a=>a.addEventListener('click',e=>{
    if (location.hash==='#inicio' || location.hash===''){ e.preventDefault(); $('#nav')?.classList.remove('open'); document.getElementById(a.dataset.jump)?.scrollIntoView({behavior:'smooth'}); }
    else { setTimeout(()=>document.getElementById(a.dataset.jump)?.scrollIntoView(), 50); }
  }));
  document.querySelectorAll('[data-jumpto]').forEach(a=>a.addEventListener('click',()=>{ state.jump=a.dataset.jumpto; }));
  document.querySelectorAll('.ac-filter button').forEach(b=>b.addEventListener('click',()=>{
    const c=b.dataset.cat, solo=c!=='todo';
    document.querySelectorAll('.ac-filter button').forEach(x=>x.setAttribute('aria-pressed', x===b?'true':'false'));
    document.querySelectorAll('.ac-item').forEach(it=>{ it.hidden = solo && it.dataset.c!==c; });
    $('.ac-grid').classList.toggle('filtered', solo);
  }));
  const cf = $('#contactForm');
  if (cf) cf.addEventListener('submit',e=>{
    e.preventDefault();
    if(!$('#c-name').value.trim() || !$('#c-email').value.includes('@')){ toast('Escribe tu nombre y un email válido'); return; }
    if(!$('#c-ok').checked){ toast('Acepta la política de privacidad para enviar'); return; }
    cf.reset(); toast('Mensaje enviado. Paco te responde en menos de 2 h (prototipo)');
  });
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{ state.loginTab=b.dataset.tab; store.set('lps-tab',state.loginTab); route(); }));
  const lf = $('#loginForm');
  if (lf) lf.addEventListener('submit', async e=>{ e.preventDefault();
    const email = $('#l-email').value.trim().toLowerCase(), pass = $('#l-pass').value;
    const sbAcc = await sbLogin(email, pass).catch(()=>null);
    if (sbAcc && sbAcc.role===state.loginTab) { setSession({role:sbAcc.role, name:sbAcc.name, full:sbAcc.full, sb:true}, $('#l-keep').checked); location.hash = sbAcc.role; return; }
        const LOGIN_ALIAS = {};
    let hash = ''; if (!Object.values(LOGIN_ALIAS).includes(email)) { try { hash = await sha256((LOGIN_ALIAS[email]||email) + ':' + pass); } catch(err) {} }
    const acc = ACCOUNTS.find(a=>a.h===hash && a.role===state.loginTab);
    if (!acc) { $('#loginErr').hidden = false; $('#l-pass').value=''; $('#l-pass').focus(); return; }
    setSession({role:acc.role, name:acc.name, full:acc.full}, $('#l-keep').checked);
    location.hash = acc.role; });
  $('#logout2')?.addEventListener('click',()=>{ sb?.auth.signOut(); setSession(null); });
  $('#forgot')?.addEventListener('click',e=>{ e.preventDefault(); toast('Te hemos enviado un enlace para crear una nueva contraseña (prototipo)'); });
  $('#logout')?.addEventListener('click',()=>{ sb?.auth.signOut(); setSession(null); location.hash='acceso'; });
  document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{ state.folder = state.folder===b.dataset.open?null:b.dataset.open; route(); }));
  document.querySelectorAll('[data-folder]').forEach(a=>a.addEventListener('click',()=>{ state.folder=a.dataset.folder; state.q=''; }));
  $('#closeFolder')?.addEventListener('click',()=>{ state.folder=null; route(); });
  const ds = $('#docSearch');
  if (ds){ ds.addEventListener('input',()=>{ state.q=ds.value; state.folder=null; const pos=ds.selectionStart; route(); const n=$('#docSearch'); n.focus(); n.setSelectionRange(pos,pos); }); }
  document.querySelectorAll('[data-dl]').forEach(b=>b.addEventListener('click',()=>toast(`Descarga de «${b.dataset.dl}» (prototipo)`)));
  document.querySelectorAll('[data-modal]').forEach(b=>b.addEventListener('click',()=>openModal(b.dataset.modal)));
  document.querySelectorAll('[data-budget]').forEach(r=>{
    const go=()=>{ state.budget=r.dataset.budget; route(); $('#budgetDetail')?.scrollIntoView({behavior:'smooth'}); };
    r.addEventListener('click',go); r.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  });
  document.querySelectorAll('[data-approve],[data-reject]').forEach(b=>b.addEventListener('click',()=>{
    const id = b.dataset.approve || b.dataset.reject, ok = !!b.dataset.approve;
    const bu = BUDGETS.find(x=>x.id===id); bu.status = ok?'Aprobado':'Rechazado'; bu.decided = today(); state.budget=id;
    if(ok){ const p = PROJECTS.find(x=>x.t===bu.title); if(p) p.s='En curso'; }
    route(); toast(ok?`Presupuesto ${id} aprobado. Paco recibe el aviso.`:`Presupuesto ${id} rechazado. Paco te contactará.`);
  }));
  document.querySelectorAll('[data-guide]').forEach(b=>b.addEventListener('click',()=>{ const role=h.startsWith('admin')?'admin':'cliente'; state.guide[role]=b.dataset.guide; state.folder=null; state.q=''; route(); }));
  document.querySelectorAll('.example a[href^="#cliente"], .example a[href^="#admin"]').forEach(a=>a.addEventListener('click',e=>{
    e.preventDefault(); const k=a.getAttribute('href').slice(1); const role=k.startsWith('admin')?'admin':'cliente';
    let sec = k.includes('-')?k.split('-')[1]:(role==='admin'?'panel':'resumen'); if(sec==='propiedad'||GUIDE[role].some(g=>g[0]===sec)){ state.guide[role]=sec; route(); }
  }));
  document.querySelectorAll('[data-rmodal]').forEach(b=>b.addEventListener('click',()=> b.dataset.rmodal==='property'?newPropertyModal():inviteModal()));
  document.querySelectorAll('[data-addclient]').forEach(b=>b.addEventListener('click',()=>inviteModal(b.dataset.addclient)));
  if ($('#mailbox') || $('#mCompose')) {
    const m = state.mail;
    const load = async () => { m.err=null; try{ if(MAIL_DEMO){ m.items = m.folder==='INBOX' ? MAIL_SAMPLE.map(x=>({...x})) : []; } else { m.items=(await mailCall('list')).items; } }catch(err){ m.items=[]; m.err='No se pudo abrir el buzón: '+err.message; } route(); };
    if (m.items===null && $('#mailbox')) load();
    const fr = $('.mb-html'); if (fr && m.open) fr.srcdoc = m.open.html;
    document.querySelectorAll('[data-mail]').forEach(b=>b.addEventListener('click',async()=>{ const uid=+b.dataset.mail; m.compose=null;
      try{ const it=m.items.find(x=>x.uid===uid); m.open = MAIL_DEMO ? {...it} : await mailCall('read',{uid}); if(it) it.seen=true; route(); }catch(err){ toast('No se pudo abrir el correo'); } }));
    document.querySelectorAll('[data-mfold]').forEach(b=>b.addEventListener('click',()=>{ m.folder=b.dataset.mfold; m.items=null; m.open=null; route(); }));
    const q=$('#mQ'); if(q) q.addEventListener('input',()=>{ m.q=q.value; clearTimeout(m.t); m.t=setTimeout(()=>{ route(); const n=$('#mQ'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length);} },250); });
    const cp=$('#mCompose'); if(cp) cp.addEventListener('click',()=>{ m.compose={}; route(); });
    const rp=$('#mReply'); if(rp) rp.addEventListener('click',()=>{ const o=m.open; m.compose={reply:true, to:o.from&&o.from.address, subject:/^re:/i.test(o.subject||'')?o.subject:'Re: '+(o.subject||''), inReplyTo:o.messageId||'', text:'\n\n— '+mWho(o.from)+' escribió:\n'+(o.text||'').split('\n').map(l=>'> '+l).join('\n')}; route(); });
    const dl=$('#mDel'); if(dl) dl.addEventListener('click',async()=>{ const uid=m.open.uid; try{ if(!MAIL_DEMO) await mailCall('delete',{uid}); m.items=m.items.filter(x=>x.uid!==uid); m.open=null; route(); toast('Correo borrado'); }catch(err){ toast('No se pudo borrar'); } });
    const cc=$('#mCancel'); if(cc) cc.addEventListener('click',()=>{ m.compose=null; route(); });
    const mf=$('#mForm'); if(mf) mf.addEventListener('submit',async e=>{ e.preventDefault(); const body={to:$('#mTo').value.trim(), subject:$('#mSubj').value.trim(), text:$('#mBody').value, inReplyTo:m.compose.inReplyTo||undefined};
      try{ if(!MAIL_DEMO) await mailCall('send',body); m.compose=null; route(); toast('Correo enviado'); }catch(err){ toast('No se pudo enviar: '+err.message); } });
  }
  const bf = $('#bannerForm');
  if (bf) {
    let draft = ads();
    const read = () => { draft = draft.map((a,i)=>({...a, on:bf.querySelector(`[data-adon="${i}"]`).checked, t:bf.querySelector(`[data-adt="${i}"]`).value.trim(), s:'', go:bf.querySelector(`[data-adgo="${i}"]`).value})); };
    const save = (msg) => { try{ localStorage.setItem(ADS_KEY, JSON.stringify(draft)); toast(msg); return true; }catch(err){ toast('No cabe tanta imagen en este navegador. Prueba con una foto más ligera.'); return false; } };
    bf.addEventListener('submit',e=>{ e.preventDefault(); read(); if(save('Anuncios guardados')) route(); });
    $('#adAdd').addEventListener('click',()=>{ read(); draft.push({on:true, img:'atardecer', t:'', s:'', go:'whatsapp'}); try{ localStorage.setItem(ADS_KEY, JSON.stringify(draft)); }catch(e){} route(); });
    bf.querySelectorAll('[data-addel]').forEach(b=>b.addEventListener('click',()=>{ read(); draft.splice(+b.dataset.addel,1); try{ localStorage.setItem(ADS_KEY, JSON.stringify(draft)); }catch(e){} route(); }));
    bf.querySelectorAll('[data-adpick]').forEach(sel=>sel.addEventListener('change',()=>{ if(!sel.value) return; const i=+sel.dataset.adpick; draft[i].img=sel.value; sel.closest('.ad-row').querySelector('img').src=PH[sel.value]; }));
    bf.querySelectorAll('[data-adfile]').forEach(inp=>inp.addEventListener('change',async()=>{ const f=inp.files[0]; if(!f) return; const i=+inp.dataset.adfile; try{ const url=await shrinkImage(f); draft[i].img=url; inp.closest('.ad-row').querySelector('img').src=url; bf.querySelector(`[data-adpick="${i}"]`).value=''; toast('Imagen lista. Pulsa Guardar anuncios.'); }catch(e){ toast('No se pudo leer la imagen'); } }));
    $('#bannerReset').addEventListener('click',()=>{ try{ localStorage.removeItem(ADS_KEY); localStorage.removeItem('lps-ads'); localStorage.removeItem('lps-promos'); }catch(e){} route(); toast('Anuncios de ejemplo restaurados'); });
  }
  const comp = $('#composer');
  if (comp) comp.addEventListener('submit',e=>{ e.preventDefault(); const v=$('#msgInput').value.trim(); if(!v) return;
    const msg={me:true, who:(session()?.full||'Tú'), at:'Ahora', t:v.replace(/</g,'&lt;')};
    if (h.endsWith('guia')) MESSAGES.push(msg); else state.myMsgs.push(msg);
    route(); toast('Mensaje enviado'); });
}

route();
</script>
